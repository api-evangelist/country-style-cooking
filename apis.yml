aid: country-style-cooking
name: Country Style Cooking
description: 'Country Style Cooking Restaurant Chain (乡村基, Xiangcunji) is a large Chinese
  quick-service restaurant group founded on 23 November 1996 in Chongqing by Li Hong and Zhang
  Xingqiang. The group operates two directly-managed chain brands — Xiangcunji (乡村基) and Mr.
  Rice (大米先生) — serving Sichuan-style fast food cooked to order in restaurant kitchens under
  a long-standing "good taste at affordable prices" operating philosophy. The company formerly
  traded on the New York Stock Exchange under the ticker CCSC and was, at the time, the only
  Asia-headquartered restaurant chain listed on the NYSE. It was surfaced in the API Evangelist
  network as a portfolio company of Hongshan. Country Style Cooking publishes a Chinese-language
  corporate website (csc100.com) covering its restaurants, brands, group news, recruiting, and
  procurement bidding, but it publishes no developer portal, no public API, and no machine-readable
  API artifacts — this profile records that verified absence of an API surface.'
